[package]
name = "repomd-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Local, reviewable codebase snapshots for AI tools"
repository = "https://github.com/alexander-yatskov/repomd"
license = "MIT"
readme = "README.md"
keywords = ["llm", "markdown", "cli", "codebase", "ai"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[[bin]]
name = "repomd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
content_inspector = "0.2"
ignore = "0.4"
anyhow = "1.0.102"
